---
# Distro dispatch — the same pattern is used by every role that has
# OS-specific behavior. To support a new distribution, add the matching
# vars/<name>.yml and tasks/setup-<distribution>.yml files; nothing else changes.
- name: Load distribution-specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Run distribution-specific setup
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup-{{ ansible_facts['distribution'] }}.yml"
