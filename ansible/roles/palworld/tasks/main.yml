---
- name: Enforce the password policy
  ansible.builtin.assert:
    that: >-
      palworld_allow_empty_passwords | bool
      or (palworld_settings['server_password'] | length > 0
          and palworld_settings['admin_password'] | length > 0)
    fail_msg: >-
      server_password and/or admin_password are empty. Export
      PALWORLD_SERVER_PASSWORD and PALWORLD_ADMIN_PASSWORD (generate with:
      openssl rand -base64 15) before deploying — see
      ansible/group_vars/palworld/palworld.yml — or set
      palworld_allow_empty_passwords: true to knowingly run a public,
      password-less server.
    quiet: true

# command (not a module): steamcmd is the only supported way to install/update
# the server; changed status is derived from its output below. Retries handle
# a known intermittent steamcmd bug where a self-restart mid-run can throw
# "Missing configuration" — simply re-running the command succeeds.
- name: Download/update the Palworld dedicated server via steamcmd
  ansible.builtin.command: >-
    {{ palworld_steamcmd_binary }} +login anonymous
    +app_update {{ palworld_app_id }} validate +quit
  args:
    chdir: "{{ palworld_user_home }}"
  become: true
  become_user: "{{ palworld_user }}"
  register: __palworld_app_update
  changed_when: "'already up to date' not in __palworld_app_update['stdout']"
  failed_when: >-
    __palworld_app_update['rc'] != 0 and
    'Missing configuration' not in __palworld_app_update['stdout']
  retries: 3
  delay: 10
  until: __palworld_app_update['rc'] == 0

- name: Check whether the save directory already exists
  ansible.builtin.stat:
    path: "{{ palworld_save_directory }}"
  register: __palworld_save_directory

# command (not a module): the server generates its default config files on
# first launch; 'timeout' kills it once they exist.
- name: Start the server once to generate its default configuration files
  ansible.builtin.command: >-
    timeout 20s ./PalServer.sh {{ palworld_systemd['advanced_options'] }}
  args:
    chdir: "{{ palworld_home_directory }}"
  become: true
  become_user: "{{ palworld_user }}"
  changed_when: not __palworld_save_directory['stat']['exists']
  failed_when: false # timeout exits with rc 124 by design
  when: not __palworld_save_directory['stat']['exists']

- name: Render PalWorldSettings.ini
  ansible.builtin.template:
    src: palworld_settings.ini.j2
    dest: "{{ palworld_settings_file }}"
    owner: "{{ palworld_user }}"
    group: "{{ palworld_user }}"
    mode: "0640"
    follow: false
  diff: false # never print the rendered passwords in --diff output
  notify: Restart palworld

- name: Render the maintenance (update + backup) script
  ansible.builtin.template:
    src: palworld-maintenance.sh.j2
    dest: "{{ palworld_user_home }}/palworld-maintenance.sh"
    owner: "{{ palworld_user }}"
    group: "{{ palworld_user }}"
    mode: "0755"

- name: Render the systemd service unit
  ansible.builtin.template:
    src: palworld.service.j2
    dest: "/etc/systemd/system/{{ palworld_service_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart palworld

- name: Apply pending handlers before managing the service state
  ansible.builtin.meta: flush_handlers

- name: Enable and start the palworld service
  ansible.builtin.systemd_service:
    name: "{{ palworld_service_name }}"
    enabled: "{{ palworld_service_enabled }}"
    state: "{{ palworld_service_state }}"
