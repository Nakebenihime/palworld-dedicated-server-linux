---
- name: Ufw | Install firewall packages
  ansible.builtin.package:
    name: "{{ firewall_packages }}"
    state: present

- name: Ufw | Configure ufw policies and rules
  block:
    - name: Ufw | Set default policies
      community.general.ufw:
        policy: "{{ item['policy'] }}"
        direction: "{{ item['direction'] }}"
      loop: "{{ firewall_default_policies }}"

    - name: Ufw | Apply firewall rules
      community.general.ufw:
        rule: "{{ item['rule'] }}"
        port: "{{ item['port'] }}"
        proto: "{{ item['proto'] }}"
        comment: "{{ item['comment'] | default(omit) }}"
      loop: "{{ firewall_rules }}"

  always:
    # Lockout guard: whatever happens above, never cut our own SSH access off.
    - name: Ufw | Always allow SSH traffic
      community.general.ufw:
        rule: allow
        port: "{{ firewall_ssh_port }}"
        proto: tcp

    - name: Ufw | Enable ufw
      community.general.ufw:
        state: enabled
