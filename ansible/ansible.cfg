[defaults]
# Trust-on-first-use: new hosts are accepted automatically (accept-new below),
# but a changed host key is a hard failure. After destroying and recreating a
# server that reuses an IP, run `make forget-host` to clear the stale key.
host_key_checking = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new
pipelining = True
