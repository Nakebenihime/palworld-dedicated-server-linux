---
# =============================================================================
# User-facing configuration for all Palworld servers (inventory group
# 'palworld'). Every file in this directory overrides the defaults of the role
# it is named after, so these files are the ONLY place most users ever need to
# touch. Full reference: the roles' defaults/main.yml files and the README
# parameter tables.
#
# This file steers the 'palworld' role (game server + systemd service) — see
# ansible/roles/palworld/defaults/main.yml.
# =============================================================================

# --- passwords (REQUIRED) ----------------------------------------------------
# The deployment fails fast if these are empty. This file is tracked by git,
# so never write password values here — export them instead:
#   eval $(make gen-passwords)                       # recommended
#   export PALWORLD_SERVER_PASSWORD="$(openssl rand -base64 15)"   # or manually
#   export PALWORLD_ADMIN_PASSWORD="$(openssl rand -base64 15)".   # or manually
# (Teams can use ansible-vault-encrypted variables instead of env vars.)
palworld_server_password: "{{ lookup('env', 'PALWORLD_SERVER_PASSWORD') }}"
palworld_admin_password: "{{ lookup('env', 'PALWORLD_ADMIN_PASSWORD') }}"

# To knowingly run a public, password-less server instead, uncomment:
# palworld_allow_empty_passwords: true

# --- server identity ---------------------------------------------------------
# palworld_server_name: "Palworld Dedicated Server on Linux"
# palworld_server_description: "Deployed with Terraform and Ansible."

# --- most-used gameplay tweaks (see roles/palworld/defaults/main.yml) --------
# Only the keys you set here are overridden; everything else keeps its default.
# palworld_settings_overrides:
#   exp_rate: 1.0
#   pal_capture_rate: 1.0
#   death_penalty: All            # None|Item|ItemAndEquipment|All
#   server_player_max_num: 32

# --- RCON (opt-in) -----------------------------------------------------------
# 1) enable it in the game settings:
# palworld_settings_overrides:
#   rcon_enabled: true
# 2) and open its port (25575/tcp) in the firewall — see firewall_rules in
#    firewall.yml. RCON needs both.

# --- service & maintenance ---------------------------------------------------
# palworld_service_enabled: true
# palworld_service_state: started
# palworld_backup_retention_days: 5
