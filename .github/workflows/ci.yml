---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Providers are discovered from the directory listing, so a new provider
  # directory is linted automatically — no workflow changes needed.
  # `_template` is deliberately included: the skeleton must never rot.
  discover-providers:
    # Pinned runner image tag (what ubuntu-latest currently resolves to) so
    # the CI environment only changes when we choose to bump it.
    runs-on: ubuntu-24.04
    outputs:
      providers: ${{ steps.matrix.outputs.providers }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          providers=$(find terraform/providers -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)
          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "discovered: $providers"

  terraform:
    needs: discover-providers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.discover-providers.outputs.providers) }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -diff -recursive
        working-directory: terraform

      - name: terraform init (no backend, no credentials)
        run: terraform init -backend=false -input=false
        working-directory: terraform/providers/${{ matrix.provider }}

      - name: terraform validate
        run: terraform validate
        working-directory: terraform/providers/${{ matrix.provider }}

      - name: terraform test (mocked/local providers, no credentials)
        run: |
          if [ -d tests ]; then terraform test; else echo "no tests directory, skipping"; fi
        working-directory: terraform/providers/${{ matrix.provider }}

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint
        working-directory: terraform/providers/${{ matrix.provider }}
        run: |
          tflint --init --config "${GITHUB_WORKSPACE}/terraform/.tflint.hcl"
          tflint --config "${GITHUB_WORKSPACE}/terraform/.tflint.hcl"

  terraform-module-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform test (shared ansible-inventory module)
        run: |
          terraform init -backend=false -input=false
          terraform test
        working-directory: terraform/modules/ansible-inventory

  ansible-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install ansible-lint (includes ansible-core)
        run: pip install "ansible-lint>=24.0.0"

      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-lint
        run: ansible-lint ansible/

      - name: playbook syntax check
        run: ansible-playbook --syntax-check -i localhost, ansible/playbook.yml
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg

  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        run: pipx run yamllint .
